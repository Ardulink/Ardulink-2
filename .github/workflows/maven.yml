# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  schedule:
  # each fifteen day of month
  - cron: "0 0 15 * *"
  push:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [ 11, 17, 21, 24 ]

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Build with Maven
      run: mvn -B -Pwith-video org.jacoco:jacoco-maven-plugin:prepare-agent compile jib:dockerBuild verify --file pom.xml

    - name: Set first matrix job environment variable
      id: set-first-job
      if: ${{ matrix.java-version == '11' }}
      run: echo "FIRST_JOB=true" >> $GITHUB_ENV

    - name: Distribute jars built
      if: ${{ env.FIRST_JOB == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: jars
        path: "*/target/*.jar"

    # colons are not allowed by upload-artifact, so we have to move (better copy) the file
    # https://github.com/actions/upload-artifact/issues/546
    - name: Copy zip to /tmp
      run: |
        for file in deploy-dist/target/ardulink-V*.zip; do
          base=$(basename "$file")
          if [[ "$base" == *SNAPSHOT* ]]; then
            sanitized=$(echo "$base" | sed -E 's/-SNAPSHOT.*\.zip$/-SNAPSHOT.zip/')
          else
            sanitized=$(echo "$base" | sed -E 's/-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{6}Z\.zip$/.zip/; s/-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z\.zip$/.zip/')
            sanitized=$(echo "$sanitized" | sed 's/\.zip\.zip$/.zip/')
          fi
          cp "$file" "/tmp/$sanitized"
        done
    - name: Distribute zip created
      if: ${{ env.FIRST_JOB == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ardulink-zip
        path: "/tmp/ardulink-V*.zip"

    - name: Test Report JDK ${{ matrix.java-version }}
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
      if: (success() || failure()) && github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'  # run this step even if previous step failed
      with:
        name: Tests Report JDK ${{ matrix.java-version }}
        path: "*/target/surefire-reports/*.xml"
        reporter: java-junit

    - name: Distribute video records
      if: ${{ env.FIRST_JOB == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: videos
        path: "*/target/videos/*"

    - name: Unzip artifact
      run: unzip deploy-dist/target/ardulink-V*.zip -d deploy-dist/target/
    - name: Cache docker images
      uses: ScribeMD/docker-cache@0.5.0
      with:
        key: docker-${{ runner.os }}-${{ matrix.java-version }}-${{ hashFiles('deploy-dist/tests/docker-compose.yml') }}

    - name: Run MQTT systemtests
      run: timeout 2m bash deploy-dist/tests/systemtest-mqtt.sh ardulink

    - name: Run REST systemtests
      run: timeout 2m bash deploy-dist/tests/systemtest-rest.sh ardulink

    - name: Run MQTT systemtests with Firmata firmware
      run: timeout 2m bash deploy-dist/tests/systemtest-mqtt.sh firmata

    - name: Run REST systemtests with Firmata firmware
      run: timeout 2m bash deploy-dist/tests/systemtest-rest.sh firmata

    - name: Remove JaCoCo aggregate and excluded module reports
      if: matrix.java-version == 11
      run: |
        find . -path '*/target/site/jacoco-aggregate' -type d -exec rm -rf {} + 2>/dev/null; true
        rm -f ardulink-swing/target/site/jacoco/jacoco.xml
        rm -f ardulink-console/arget/site/jacoco/jacoco.xml

    - name: Codecov
      if: matrix.java-version == 11
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

