name: OWASP Dependency-Check

on:
  push:
    branches: ["master"]
    paths:
      - "**/pom.xml"
      - "dependency-check/**"
      - ".github/workflows/dependency-check.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "**/pom.xml"
      - "dependency-check/**"
      - ".github/workflows/dependency-check.yml"
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 17
          distribution: 'temurin'
          cache: maven

      # Own key with restore-keys: setup-java's maven cache is exact-match only
      # and shared with maven.yml, so the OWASP database never survives there.
      - name: Cache OWASP data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dc-data
          key: owasp-data-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            owasp-data-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -Powasp -DskipTests -Dmodernizer.skip -DdataDirectory="$PWD/.dc-data" verify

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-report
          path: "*/target/dependency-check-report.html"
